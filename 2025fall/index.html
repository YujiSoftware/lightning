# アジェンダ

* var
* toMap
* record（新しいのに“新しさを感じない”やつ）

<br>
発表メモ  
--
Javaは進化が遅い？  
--
**大丈夫です、私たちもそんなに早く進化できないのでちょうどいいです。**

---

# var（共感系）

* Java10で導入された型推論
* 使えると便利
* 使いすぎると読めなくなる

```java
var map = new HashMap<String, List<String>>();
```
--
発表メモ（笑い）  
Javaに var が入った時のみんなの反応：  
--
**“いや、Kotlin じゃん！”**  
--
**Java『違います！ぼ、僕は僕なんです！』**

---

# Collectors.toMap の衝突（鉄板ネタ）

* キー衝突すると例外（現場でもよくある事故）

```java
var map = people.stream().collect(
  Collectors.toMap(Person::name, Person::score)
);
```
--
発表メモ  
Java『キーが重複してます！例外です！』  
--
Python『まぁとりあえず最後のにしとくね？』  
--
Java『……えっ』  
--
**（Java の“厳格さ”をいじると大抵ウケます）**

---

# record（新しいのに古く見えるネタ）

```java
public record Point(int x, int y) {}
```
--
発表メモ  
新機能のはずなのに、なんか“昔からありました感”がすごい。  
--
Javaの新機能ってだいたい、  
**“おそらく最初から入っていると思われていたもの”**
なんですよね。  
--
**（共感ネタで大体ウケる）**
